name: kick
# Backup: restart the relay chain if it died; fail loudly (email to whoever last
# edited this cron) if the private tick has not run for >60 min.
# Before PVHP_DISPATCH_TOKEN is set it only warns and does nothing (no chain start).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check chain and last tick
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.PVHP_DISPATCH_TOKEN }}
          TARGET: ${{ secrets.PVHP_TARGET_REPO }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::PVHP_DISPATCH_TOKEN not set yet - setup incomplete, doing nothing"
            exit 0
          fi
          active=$(gh run list -R "$GITHUB_REPOSITORY" -w relay.yml -L 20 \
                   --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "${active:-0}" = "0" ]; then
            gh workflow run relay.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "::warning::relay chain was dead - restarted"
          fi
          last=$(GH_TOKEN="$PAT" gh run list -R "$TARGET" -w pvhp-tick.yml -L 1 \
                 --json createdAt --jq '.[0].createdAt' 2>/dev/null || true)
          if [ -z "$last" ]; then echo "::error::cannot read tick runs"; exit 1; fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "last tick ${age}s ago"
          if [ "$age" -gt 3600 ]; then echo "::error::no pvhp tick for ${age}s"; exit 1; fi
