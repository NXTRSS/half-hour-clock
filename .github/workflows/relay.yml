name: relay
# Self-dispatching clock for pvhp-tick. Environment wait 24 min (unbilled) + align to
# :00/:30 Europe/Warsaw. Dispatches private pvhp only on day/night cadence (see dispatch_gate.py).
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    environment: half-hour          # wait timer 24 min, branch main only
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Align to next :00 / :30 Europe/Warsaw (max 15 min)
        run: |
          wait=$(python3 .github/scripts/align_wait_seconds.py)
          echo "sleep ${wait}s (Warsaw slot)"
          [ "$wait" -gt 0 ] && sleep "$wait"

      - name: Dispatch successor (keeps the chain alive)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run relay.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep $(( i * 10 ))
          done
          echo "::error::could not dispatch successor"; exit 1

      - name: Dispatch pvhp tick (private repo, cadence gate)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PVHP_DISPATCH_TOKEN }}
          TARGET: ${{ secrets.PVHP_TARGET_REPO }}
        run: |
          if ! python3 .github/scripts/dispatch_gate.py; then
            echo "skip pvhp-tick dispatch (cadence — saves private Actions minutes)"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            gh workflow run pvhp-tick.yml -R "$TARGET" --ref main >/dev/null 2>&1 && { echo "tick dispatched"; exit 0; }
            sleep $(( i * 10 ))
          done
          echo "::error::tick dispatch failed"; exit 1
