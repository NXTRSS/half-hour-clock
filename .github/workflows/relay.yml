name: relay
# Self-dispatching 30-min clock. The 24-min wait is an environment wait timer
# (not billed, no runner held). Each cycle: wait -> align to :04/:34 UTC ->
# dispatch successor (GITHUB_TOKEN) -> dispatch private pvhp tick (PAT).
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    environment: half-hour          # wait timer 24 min, branch main only
    timeout-minutes: 20
    steps:
      - name: Align to next :04 / :34 UTC (max 15 min)
        run: |
          now=$(date -u +%s)
          m=$(( (now / 60) % 30 )); s=$(( now % 60 ))
          wait=$(( ((4 - m + 30) % 30) * 60 - s ))
          [ "$wait" -lt 0 ] && wait=$(( wait + 1800 ))
          [ "$wait" -gt 900 ] && wait=0   # just past a slot -> fire now
          echo "sleep ${wait}s"; sleep "$wait"

      - name: Dispatch successor (keeps the chain alive)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run relay.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep $(( i * 10 ))
          done
          echo "::error::could not dispatch successor"; exit 1

      - name: Dispatch pvhp tick (private repo)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PVHP_DISPATCH_TOKEN }}
          TARGET: ${{ secrets.PVHP_TARGET_REPO }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run pvhp-tick.yml -R "$TARGET" --ref main >/dev/null 2>&1 && { echo "tick dispatched"; exit 0; }
            sleep $(( i * 10 ))
          done
          echo "::error::tick dispatch failed"; exit 1
